<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520"><title>Per-output controller</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="490" y="35" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="23" font-weight="700" fill="#111">Implemented controller: one FREE / HELD pair per active output</text><rect x="135" y="200" width="250" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="260.0" y="242.92" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#111">FREE</text><text x="260.0" y="272.91999999999996" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#111">grant = 00000</text><rect x="595" y="200" width="250" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="720.0" y="242.92" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#111">HELD</text><text x="720.0" y="272.91999999999996" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#111">grant = one-hot</text><polyline points="385,230 595,230" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="490" y="200" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Request found at edge</text><polyline points="595,275 385,275" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="490" y="310" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">Accepted: valid AND ready</text><polyline points="735,200 735,125 875,125 875,250 845,250" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="780" y="98" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">Not ready: hold</text><polyline points="245,300 245,385 105,385 105,250 135,250" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="235" y="420" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">No request: remain FREE</text><text x="490" y="473" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Reset clears held grant and rotating pointer; each output runs independently.</text></svg>