<svg xmlns="http://www.w3.org/2000/svg" width="950" height="630" viewBox="0 0 950 630"><title>Router functional flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="475" y="32" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" fill="#111">Functional flow at each router</text><rect x="315" y="75" width="320" height="65" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="113.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Accepted input handshake</text><polyline points="475,140 475,178" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="315" y="178" width="320" height="65" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="216.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Store in active input FIFO</text><polyline points="475,243 475,278" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="315" y="278" width="320" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="307.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Head packet route</text><text x="475.0" y="331.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">X mismatch? E / W</text><text x="475.0" y="355.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Else Y mismatch? S / N</text><polyline points="475,373 475,412" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="315" y="412" width="320" height="60" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="447.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Otherwise request Local</text><polyline points="635,325 765,325 765,517" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="475,472 475,517" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="225" y="517" width="600" height="65" fill="white" stroke="#111" stroke-width="1.8"/><text x="525.0" y="555.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Per-output round robin → held grant → accepted transfer</text><text x="475" y="614" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">Local is chosen before any link transfer when destination equals current coordinates.</text></svg>