3.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">unchanged</text><rect x="40" y="268" width="250" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="165.0" y="304.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Accepted edge</text><rect x="290" y="268" width="115" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="347.5" y="304.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">N</text><rect x="405" y="268" width="100" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="455.0" y="304.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">1</text><rect x="505" y="268" width="335" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="672.5" y="304.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Pop N; clear grant</text><rect x="840" y="268" width="165" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="922.5" y="304.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">S</text><rect x="40" y="329" width="250" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="165.0" y="365.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Arbitration bubble</text><rect x="290" y="329" width="115" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="347.5" y="365.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">none</text><rect x="405" y="329" width="100" height="61" fill="white" stroke="#111" stroke-width="1.8"/><text x="455.0" y="365.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" 