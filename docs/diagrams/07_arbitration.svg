y="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Corner router: three active requesters. Sink stalls do not consume the fairness bound.</text><text x="525" y="567" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">One bubble per acceptance gives a per-output ceiling of 0.5 flits/cycle.</text></svg>