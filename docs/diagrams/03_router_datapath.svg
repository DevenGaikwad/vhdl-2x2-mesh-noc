<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="720" viewBox="0 0 1150 720"><title>Router datapath</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="575" y="35" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" fill="#111">One corner router: data and control</text><rect x="30" y="130" width="180" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="120.0" y="159.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Local</text><text x="120.0" y="182.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">valid / ready</text><rect x="255" y="130" width="190" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="350.0" y="158.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Depth-D FIFO</text><text x="350.0" y="182.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">head / occupancy</text><polyline points="210,165 255,165" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="485" y="130" width="170" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="570.0" y="158.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">XY route</text><text x="570.0" y="182.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">next output</text><polyline points="445,165 485,165" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="655,165 720,165" fill="none" stroke="#111" stroke-width="1.8"/><rect x="30" y="280" width="180" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="120.0" y="309.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Horizontal neighbor</text><text x="120.0" y="332.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">valid / ready</text><rect x="255" y="280" width="190" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="350.0" y="308.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Depth-D FIFO</text><text x="350.0" y="332.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">head / occupancy</text><polyline points="210,315 255,315" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="485" y="280" width="170" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="570.0" y="308.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">XY route</text><text x="570.0" y="332.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">next output</text><polyline points="445,315 485,315" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="655,315 720,315" fill="none" stroke="#111" stroke-width="1.8"/><rect x="30" y="430" width="180" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="120.0" y="459.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Vertical neighbor</text><text x="120.0" y="482.11" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">valid / ready</text><rect x="255" y="430" width="190" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="350.0" y="458.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Depth-D FIFO</text><text x="350.0" y="482.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">head / occupancy</text><polyline points="210,465 255,465" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="485" y="430" width="170" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="570.0" y="458.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">XY route</text><text x="570.0" y="482.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">next output</text><polyline points="445,465 485,465" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="655,465 720,465" fill="none" stroke="#111" stroke-width="1.8"/><rect x="720" y="115" width="170" height="395" fill="white" stroke="#111" stroke-width="1.8"/><text x="805.0" y="254.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">Request</text><text x="805.0" y="280.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">matrix</text><text x="805.0" y="306.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111"></text><text x="805.0" y="332.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">One head</text><text x="805.0" y="358.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">requests</text><text x="805.0" y="384.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">one output</text><polyline points="890,315 960,315" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="960" y="265" width="155" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="1037.5" y="296.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Round robin</text><text x="1037.5" y="320.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">per output</text><text x="1037.5" y="344.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">held grant</text><rect x="485" y="590" width="405" height="70" fill="white" stroke="#111" stroke-width="1.8"/><text x="687.5" y="631.6" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">Crossbar mux of retained FIFO heads</text><polyline points="445,185 465,185 465,625 485,625" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="445,335 465,335 465,625 485,625" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="445,485 465,485 465,625 485,625" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="1037,365 1037,555 820,555 820,590" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><polyline points="890,625 1115,625" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="995" y="602" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">data + valid</text><text x="575" y="675" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Pop and advance priority only on output valid AND ready</text><text x="575" y="702" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Ready depends on registered FIFO occupancy. No extra output packet register.</text></svg>