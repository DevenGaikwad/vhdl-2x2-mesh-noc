<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>Testbench accepted-injection scoreboard</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="35" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" fill="#111">Self-checking accepted-transaction scoreboard</text><rect x="40" y="115" width="280" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="180.0" y="156.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">Stable source stimulus</text><text x="180.0" y="182.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">valid until ready</text><rect x="410" y="115" width="280" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="550.0" y="156.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">Injection accepted at edge</text><text x="550.0" y="182.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">store full 32-bit packet</text><polyline points="320,160 410,160" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="795" y="115" width="260" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="925.0" y="156.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">Pending table</text><text x="925.0" y="182.1" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="400" fill="#111">unique payload UID</text><polyline points="690,160 795,160" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="50" y="340" width="290" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="195.0" y="381.27" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="400" fill="#111">Link accepted</text><text x="195.0" y="406.27" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="400" fill="#111">check XY + location + hop</text><rect x="405" y="340" width="290" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="550.0" y="369.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Delivery accepted</text><text x="550.0" y="393.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">check word + destination</text><text x="550.0" y="417.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">unique stream order</text><rect x="760" y="340" width="290" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="905.0" y="369.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Reset edge</text><text x="905.0" y="393.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">explicitly discard pending</text><text x="905.0" y="417.44" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">clear stream expectations</text><polyline points="925,210 925,265 195,265 195,340" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="925,265 550,265 550,340" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="925,265 925,340" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="335" y="520" width="440" height="85" fill="white" stroke="#111" stroke-width="1.8"/><text x="555.0" y="543.77" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="400" fill="#111">Drain invariant</text><text x="555.0" y="568.77" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="400" fill="#111">Accepted = delivered + reset discards</text><text x="555.0" y="593.77" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="400" fill="#111">No unexplained pending transaction</text><polyline points="195,435 195,480 550,480" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="550,435 550,480 550,480" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="905,435 905,480 550,480" fill="none" stroke="#111" stroke-width="1.8"/><polyline points="550,480 550,520" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="550" y="637" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Watchdog bounds completion; global ordering between independent sources is not required.</text></svg>