<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><title>Canonical mesh topology</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="35" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" fill="#111">Canonical 2 × 2 topology</text><rect x="120" y="150" width="260" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="250.0" y="191.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">R00 · (X=0, Y=0)</text><text x="250.0" y="215.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">P00 · CPU 1 model</text><text x="250.0" y="239.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Local injection / ejection</text><rect x="620" y="150" width="260" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="750.0" y="191.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">R01 · (X=1, Y=0)</text><text x="750.0" y="215.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">P01 · Memory model</text><text x="750.0" y="239.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Local injection / ejection</text><rect x="120" y="420" width="260" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="250.0" y="461.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">R10 · (X=0, Y=1)</text><text x="250.0" y="485.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">P10 · CPU 2 model</text><text x="250.0" y="509.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Local injection / ejection</text><rect x="620" y="420" width="260" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="750.0" y="461.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">R11 · (X=1, Y=1)</text><text x="750.0" y="485.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">P11 · AI model</text><text x="750.0" y="509.94" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">Local injection / ejection</text><polyline points="380,190 620,190" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="620,215 380,215" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="500" y="175" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">East / West</text><polyline points="380,460 620,460" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="620,485 380,485" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="500" y="445" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">East / West</text><polyline points="200,270 200,420" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="240,420 240,270" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="282" y="355" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">S / N</text><polyline points="700,270 700,420" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="740,420 740,270" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="782" y="355" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="400" fill="#111">S / N</text><text x="500" y="617" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="400" fill="#111">X increases east; Y increases south. Four pairs = eight directed channels.</text></svg>