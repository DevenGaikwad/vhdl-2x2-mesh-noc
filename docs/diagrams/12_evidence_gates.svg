<svg xmlns="http://www.w3.org/2000/svg" width="950" height="670" viewBox="0 0 950 670"><title>Tool and board evidence gates</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="475" y="35" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" fill="#111">Evidence gates remain distinct</text><rect x="120" y="95" width="710" height="80" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="128.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">VHDL-2008 portable tests + controlled RTL experiments</text><text x="475.0" y="155.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">GHDL: verified here</text><rect x="120" y="215" width="710" height="80" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="248.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Vivado 2026.1 behavioral XSim + exact-part synthesis</text><text x="475.0" y="275.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Required local execution: pending</text><rect x="120" y="335" width="710" height="80" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="368.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Out-of-context demo place/route + internal STA</text><text x="475.0" y="395.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Required local execution: pending</text><rect x="120" y="455" width="710" height="80" fill="white" stroke="#111" stroke-width="1.8"/><text x="475.0" y="488.43" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Verified board constraints + bitstream + programming</text><text x="475.0" y="515.4300000000001" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="400" fill="#111">Board model / clock / pinout missing</text><polyline points="475,175 475,215" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="475,295 475,335" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><polyline points="475,415 475,455" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="475" y="615" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" fill="#111">Frontend CI proves application checks only. It does not certify FPGA implementation.</text></svg>